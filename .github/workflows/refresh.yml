name: Check external tutorial revisions

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: read
  actions: write

concurrency:
  group: tutorial-revision-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'nbformat>=5.10,<6'
      - name: Check the published source manifest
        id: sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          address=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)
          python site/build.py --check-updates --base-url "$address"
      - name: Request publication of changed sources
        if: steps.sources.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
